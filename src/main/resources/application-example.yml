# 复制本文件为 application.yml 并填入你自己的配置；application.yml 已被 .gitignore 忽略，不会提交
spring:
  application:
    name: cake-pic-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://<YOUR_DB_HOST>:3306/cake_pic
    username: <YOUR_DB_USERNAME>
    password: <YOUR_DB_PASSWORD>
    hikari:
      # 连接在池中的最大生存时间（毫秒），建议小于数据库 wait_timeout
      max-lifetime: 60000
      connection-timeout: 30000
  # Spring Session（Redis 持久化登录态）
  session:
    store-type: redis
    timeout: 86400
  redis:
    host: <YOUR_REDIS_HOST>
    port: 6379
    password: <YOUR_REDIS_PASSWORD>
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
        time-between-eviction-runs: 10s
    database: 2
  servlet:
    multipart:
      max-file-size: 20MB
  # Kafka：图片可靠删除链路
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:19092,127.0.0.1:19093,127.0.0.1:19094}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        "[enable.idempotence]": true
    consumer:
      group-id: picture-cleanup-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # 关闭自动提交，业务处理成功后手动 ACK
      enable-auto-commit: false
      auto-offset-reset: earliest
    listener:
      ack-mode: record

server:
  port: 8123
  servlet:
    context-path: /api

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: isDelete
      logic-delete-value: 1
      logic-not-delete-value: 0
    enable-sql-runner: true

# 接口文档（Knife4j）
knife4j:
  enable: true
  openapi:
    title: cake-pic项目
    version: v0.1
    license: Apache 2.0
    group:
      default:
        api-rule: package
        api-rule-resources:
          - com.sharkycake.controller

# 腾讯云 COS：建议改用环境变量注入，避免写入配置文件
cos:
  client:
    secret-id: ${COS_SECRET_ID:<YOUR_COS_SECRET_ID>}
    secret-key: ${COS_SECRET_KEY:<YOUR_COS_SECRET_KEY>}
    host: <YOUR_COS_BUCKET_HOST>
    region: <YOUR_COS_REGION>
    bucket: <YOUR_COS_BUCKET>

# 阿里云通义 AI（扩图）
aliYunAi:
  apiKey: ${ALIYUN_AI_API_KEY:<YOUR_ALIYUN_AI_API_KEY>}
