<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1170" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#333333"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1280" height="1170" fill="#ffffff"/>

  <!-- ================= 客户端层 ================= -->
  <rect x="20" y="30" width="120" height="90" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="80" y="80" font-size="16" font-weight="bold" text-anchor="middle" fill="#1f3864">客户端层</text>
  <rect x="160" y="30" width="1060" height="90" fill="#dae8fc" fill-opacity="0.45" stroke="#6c8ebf"/>
  <rect x="300" y="50" width="220" height="50" rx="8" fill="#ffffff" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="410" y="80" font-size="14" text-anchor="middle">Web 前端</text>
  <rect x="580" y="50" width="220" height="50" rx="8" fill="#ffffff" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="690" y="80" font-size="14" text-anchor="middle">微信小程序</text>
  <rect x="860" y="50" width="220" height="50" rx="8" fill="#ffffff" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="970" y="80" font-size="14" text-anchor="middle">Knife4j / Postman</text>

  <line x1="410" y1="120" x2="410" y2="186" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="418" y="158" font-size="11" fill="#555">HTTP 请求</text>
  <line x1="690" y1="120" x2="560" y2="186" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="640" y="150" font-size="11" fill="#555">HTTP 请求</text>
  <line x1="970" y1="120" x2="915" y2="186" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="960" y="150" font-size="11" fill="#555">接口调试</text>

  <!-- ================= 接入层 ================= -->
  <rect x="20" y="170" width="120" height="90" rx="6" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
  <text x="80" y="220" font-size="16" font-weight="bold" text-anchor="middle" fill="#7f6000">接入层</text>
  <rect x="160" y="170" width="1060" height="90" fill="#fff2cc" fill-opacity="0.45" stroke="#d6b656"/>
  <rect x="300" y="190" width="300" height="50" rx="8" fill="#ffffff" stroke="#d6b656" stroke-width="1.5"/>
  <text x="450" y="212" font-size="14" text-anchor="middle">RESTful API</text>
  <text x="450" y="230" font-size="11" text-anchor="middle" fill="#777">/api/*（统一返回体 BaseResponse）</text>
  <rect x="760" y="190" width="300" height="50" rx="8" fill="#ffffff" stroke="#d6b656" stroke-width="1.5"/>
  <text x="910" y="212" font-size="14" text-anchor="middle">WebSocket</text>
  <text x="910" y="230" font-size="11" text-anchor="middle" fill="#777">/ws/picture/edit 协作编辑通道</text>

  <line x1="450" y1="240" x2="450" y2="306" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="458" y="280" font-size="11" fill="#555">Sa-Token 登录校验 / 参数校验</text>
  <path d="M1060,215 L1245,215 L1245,592 L1206,592" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="1150" y="208" font-size="11" fill="#555">编辑消息事件</text>

  <!-- ================= 应用层 ================= -->
  <rect x="20" y="310" width="120" height="90" rx="6" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/>
  <text x="80" y="360" font-size="16" font-weight="bold" text-anchor="middle" fill="#7f4f00">应用层</text>
  <rect x="160" y="310" width="1060" height="90" fill="#ffe6cc" fill-opacity="0.45" stroke="#d79b00"/>
  <g font-size="12" text-anchor="middle">
    <rect x="172" y="330" width="160" height="50" rx="8" fill="#ffffff" stroke="#d79b00" stroke-width="1.5"/>
    <text x="252" y="352">UserController</text><text x="252" y="368" font-size="11" fill="#777">用户 / 登录</text>
    <rect x="347" y="330" width="160" height="50" rx="8" fill="#ffffff" stroke="#d79b00" stroke-width="1.5"/>
    <text x="427" y="352">PictureController</text><text x="427" y="368" font-size="11" fill="#777">图片管理</text>
    <rect x="522" y="330" width="160" height="50" rx="8" fill="#ffffff" stroke="#d79b00" stroke-width="1.5"/>
    <text x="602" y="352">SpaceController</text><text x="602" y="368" font-size="11" fill="#777">空间管理</text>
    <rect x="697" y="330" width="160" height="50" rx="8" fill="#ffffff" stroke="#d79b00" stroke-width="1.5"/>
    <text x="777" y="352">SpaceUserController</text><text x="777" y="368" font-size="11" fill="#777">团队成员</text>
    <rect x="872" y="330" width="160" height="50" rx="8" fill="#ffffff" stroke="#d79b00" stroke-width="1.5"/>
    <text x="952" y="352">SpaceAnalyze</text><text x="952" y="368" font-size="11" fill="#777">空间统计</text>
    <rect x="1047" y="330" width="160" height="50" rx="8" fill="#ffffff" stroke="#d79b00" stroke-width="1.5"/>
    <text x="1127" y="352">FileController</text><text x="1127" y="368" font-size="11" fill="#777">存储连通性</text>
  </g>

  <line x1="610" y1="400" x2="610" y2="446" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="620" y="428" font-size="11" fill="#555">业务编排</text>

  <!-- ================= 服务层 ================= -->
  <rect x="20" y="450" width="120" height="230" rx="6" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
  <text x="80" y="560" font-size="16" font-weight="bold" text-anchor="middle" fill="#274e13">服务层</text>
  <rect x="160" y="450" width="1060" height="230" fill="#d5e8d4" fill-opacity="0.45" stroke="#82b366"/>
  <g font-size="12" text-anchor="middle">
    <rect x="172" y="470" width="190" height="50" rx="8" fill="#ffffff" stroke="#82b366" stroke-width="1.5"/>
    <text x="267" y="492">UserService</text><text x="267" y="508" font-size="11" fill="#777">注册 / 登录态</text>
    <rect x="382" y="470" width="190" height="50" rx="8" fill="#ffffff" stroke="#82b366" stroke-width="1.5"/>
    <text x="477" y="492">PictureService</text><text x="477" y="508" font-size="11" fill="#777">上传 / 审核 / 搜索</text>
    <rect x="592" y="470" width="190" height="50" rx="8" fill="#ffffff" stroke="#82b366" stroke-width="1.5"/>
    <text x="687" y="492">SpaceService</text><text x="687" y="508" font-size="11" fill="#777">等级 / 配额</text>
    <rect x="802" y="470" width="190" height="50" rx="8" fill="#ffffff" stroke="#82b366" stroke-width="1.5"/>
    <text x="897" y="492">SpaceUserService</text><text x="897" y="508" font-size="11" fill="#777">成员管理</text>
    <rect x="1012" y="470" width="190" height="50" rx="8" fill="#ffffff" stroke="#82b366" stroke-width="1.5"/>
    <text x="1107" y="492">SpaceAnalyzeService</text><text x="1107" y="508" font-size="11" fill="#777">六维统计</text>
  </g>
  <text x="177" y="548" font-size="12" font-weight="bold" fill="#274e13">支撑组件</text>
  <g font-size="12" text-anchor="middle">
    <rect x="177" y="565" width="245" height="55" rx="8" fill="#ffffff" stroke="#82b366" stroke-width="1.5" stroke-dasharray="5 3"/>
    <text x="299" y="587">Sa-Token + AOP 鉴权</text><text x="299" y="604" font-size="11" fill="#777">平台角色 / 空间权限注解</text>
    <rect x="437" y="565" width="245" height="55" rx="8" fill="#ffffff" stroke="#82b366" stroke-width="1.5" stroke-dasharray="5 3"/>
    <text x="559" y="587">上传模板方法</text><text x="559" y="604" font-size="11" fill="#777">File / URL 两种策略</text>
    <rect x="697" y="565" width="245" height="55" rx="8" fill="#ffffff" stroke="#82b366" stroke-width="1.5" stroke-dasharray="5 3"/>
    <text x="819" y="587">空间权限 JSON 配置</text><text x="819" y="604" font-size="11" fill="#777">角色 → 权限动态计算</text>
    <rect x="957" y="565" width="245" height="55" rx="8" fill="#ffffff" stroke="#82b366" stroke-width="1.5" stroke-dasharray="5 3"/>
    <text x="1079" y="587">Disruptor 事件队列</text><text x="1079" y="604" font-size="11" fill="#777">环形队列 262144 槽位</text>
  </g>

  <g stroke="#333" stroke-width="1.5">
    <line x1="270" y1="680" x2="270" y2="741" marker-end="url(#arr)"/>
    <line x1="550" y1="680" x2="550" y2="741" marker-end="url(#arr)"/>
    <line x1="830" y1="680" x2="830" y2="741" marker-end="url(#arr)"/>
    <line x1="1110" y1="680" x2="1110" y2="741" marker-end="url(#arr)"/>
  </g>
  <g font-size="11" fill="#555">
    <text x="278" y="715">事务 · 聚合查询</text>
    <text x="558" y="715">缓存 · 分布式锁 · 会话</text>
    <text x="838" y="715">删除事件</text>
    <text x="1118" y="715">原图 · 缩略图</text>
  </g>

  <!-- ================= 基础设施 ================= -->
  <rect x="20" y="730" width="120" height="110" rx="6" fill="#f5f5f5" stroke="#666666" stroke-width="1.5"/>
  <text x="80" y="790" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">基础设施</text>
  <rect x="160" y="730" width="1060" height="110" fill="#f5f5f5" fill-opacity="0.6" stroke="#666666"/>
  <g>
    <path d="M165,757 V813 A105,12 0 0 0 375,813 V757" fill="#ffffff" stroke="#666" stroke-width="1.5"/>
    <ellipse cx="270" cy="757" rx="105" ry="12" fill="#ffffff" stroke="#666" stroke-width="1.5"/>
    <text x="270" y="790" font-size="13" text-anchor="middle">MySQL</text>
    <text x="270" y="806" font-size="11" text-anchor="middle" fill="#777">MyBatis-Plus</text>
    <path d="M445,757 V813 A105,12 0 0 0 655,813 V757" fill="#ffffff" stroke="#666" stroke-width="1.5"/>
    <ellipse cx="550" cy="757" rx="105" ry="12" fill="#ffffff" stroke="#666" stroke-width="1.5"/>
    <text x="550" y="790" font-size="13" text-anchor="middle">Redis</text>
    <text x="550" y="806" font-size="11" text-anchor="middle" fill="#777">Redisson · Spring Session</text>
    <path d="M725,757 V813 A105,12 0 0 0 935,813 V757" fill="#ffffff" stroke="#666" stroke-width="1.5"/>
    <ellipse cx="830" cy="757" rx="105" ry="12" fill="#ffffff" stroke="#666" stroke-width="1.5"/>
    <text x="830" y="790" font-size="13" text-anchor="middle">Kafka</text>
    <text x="830" y="806" font-size="10" text-anchor="middle" fill="#777">picture.cleanup.requested</text>
    <path d="M1005,757 V813 A105,12 0 0 0 1215,813 V757" fill="#ffffff" stroke="#666" stroke-width="1.5"/>
    <ellipse cx="1110" cy="757" rx="105" ry="12" fill="#ffffff" stroke="#666" stroke-width="1.5"/>
    <text x="1110" y="790" font-size="13" text-anchor="middle">腾讯云 COS</text>
    <text x="1110" y="806" font-size="11" text-anchor="middle" fill="#777">对象存储 · WebP / 缩略图</text>
  </g>

  <path d="M830,825 L830,860 L690,860 L690,906" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="700" y="853" font-size="11" fill="#555">轮询 Outbox 投递</text>
  <path d="M775,825 L775,885 L330,885 L330,906" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="420" y="878" font-size="11" fill="#555">消费删除消息</text>

  <!-- ================= 异步与调度 ================= -->
  <rect x="20" y="890" width="120" height="100" rx="6" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/>
  <text x="80" y="932" font-size="15" font-weight="bold" text-anchor="middle" fill="#403151">异步</text>
  <text x="80" y="952" font-size="15" font-weight="bold" text-anchor="middle" fill="#403151">与调度</text>
  <rect x="160" y="890" width="1060" height="100" fill="#e1d5e7" fill-opacity="0.45" stroke="#9673a6"/>
  <g font-size="12" text-anchor="middle">
    <rect x="170" y="910" width="320" height="60" rx="8" fill="#ffffff" stroke="#9673a6" stroke-width="1.5"/>
    <text x="330" y="934">PictureCleanupConsumer</text>
    <text x="330" y="952" font-size="11" fill="#777">幂等消费 · 手动 ACK · 删除文件</text>
    <rect x="530" y="910" width="320" height="60" rx="8" fill="#ffffff" stroke="#9673a6" stroke-width="1.5"/>
    <text x="690" y="934">OutboxMessagePublisher</text>
    <text x="690" y="952" font-size="11" fill="#777">定时扫描 Outbox 表投递 Kafka</text>
    <rect x="890" y="910" width="320" height="60" rx="8" fill="#ffffff" stroke="#9673a6" stroke-width="1.5"/>
    <text x="1050" y="934">定时补偿任务</text>
    <text x="1050" y="952" font-size="11" fill="#777">CleanUselessPicture · RecoveryJob</text>
  </g>
  <line x1="890" y1="940" x2="854" y2="940" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="872" y="932" font-size="10" fill="#555" text-anchor="middle">补偿</text>

  <path d="M1220,650 L1262,650 L1262,1085 L1074,1085" fill="none" stroke="#333" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arr)"/>
  <text x="1268" y="870" font-size="11" fill="#555" writing-mode="tb">调用第三方</text>

  <!-- ================= 第三方服务 ================= -->
  <rect x="20" y="1040" width="120" height="90" rx="6" fill="#f8cecc" stroke="#b85450" stroke-width="1.5"/>
  <text x="80" y="1090" font-size="16" font-weight="bold" text-anchor="middle" fill="#78281f">第三方</text>
  <rect x="160" y="1040" width="1060" height="90" fill="#f8cecc" fill-opacity="0.45" stroke="#b85450"/>
  <g font-size="13" text-anchor="middle">
    <rect x="310" y="1060" width="340" height="50" rx="8" fill="#ffffff" stroke="#b85450" stroke-width="1.5"/>
    <text x="480" y="1082">阿里云通义 AI</text>
    <text x="480" y="1099" font-size="11" text-anchor="middle" fill="#777">图片扩图 / 智能编辑</text>
    <rect x="730" y="1060" width="340" height="50" rx="8" fill="#ffffff" stroke="#b85450" stroke-width="1.5"/>
    <text x="900" y="1082">以图搜图服务</text>
    <text x="900" y="1099" font-size="11" text-anchor="middle" fill="#777">ImageSearchApiFacade 门面</text>
  </g>
</svg>
